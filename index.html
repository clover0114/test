<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CSVをブラウザだけで表示・絞り込みできる一時的な表計算ビューア">
  <title>CSVチェッカー</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231b2430'/%3E%3Cpath d='M18 16h28v32H18z' fill='none' stroke='%235ce1b8' stroke-width='4'/%3E%3Cpath d='M18 27h28M18 38h28M31 16v32' stroke='%235ce1b8' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#edf4f2;--muted:#a8b6b7;--bg:#10161c;--panel:#17212a;--panel2:#1d2a34;--line:#30414b;--accent:#5ce1b8;--accent2:#a4f2da;--danger:#ff8d87;--shadow:0 18px 50px rgba(0,0,0,.24)}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(circle at 75% -10%,#203b42 0,#10161c 42%);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif} body{padding:28px 22px 40px}.app{max-width:1440px;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:13px}.mark{width:42px;height:42px;border:2px solid var(--accent);border-radius:12px;display:grid;place-items:center;color:var(--accent);font-weight:800;letter-spacing:-4px;padding-right:4px}.brand h1{font-size:20px;line-height:1.1;margin:0;letter-spacing:.02em}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}.privacy{font-size:13px;color:var(--accent2);border:1px solid #2d7463;border-radius:999px;padding:8px 13px;white-space:nowrap}.intro{max-width:760px;margin-bottom:25px}.intro h2{font-size:clamp(28px,4vw,45px);letter-spacing:-.05em;line-height:1.05;margin:0 0 13px}.intro p{margin:0;color:var(--muted);font-size:16px;line-height:1.7}.dropzone{border:1px dashed #5d7980;border-radius:20px;padding:36px 24px;background:linear-gradient(135deg,rgba(42,64,73,.74),rgba(23,33,42,.92));box-shadow:var(--shadow);cursor:pointer;transition:.2s;border-style:dashed;text-align:center}.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:linear-gradient(135deg,rgba(32,83,80,.8),rgba(23,33,42,.94));transform:translateY(-1px)}.dropzone strong{font-size:18px;display:block}.dropzone span{display:block;color:var(--muted);margin:9px 0 20px;font-size:14px}.choose{display:inline-block;background:var(--accent);color:#09231d;font-weight:750;border:0;border-radius:10px;padding:11px 17px;font-size:15px;cursor:pointer}.dropzone input{display:none}.workspace{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.toolbar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line);flex-wrap:wrap}.file-info{display:flex;align-items:center;gap:10px;min-width:0}.file-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}.stats{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer;font-size:13px}.ghost:hover{border-color:var(--accent);color:var(--accent2)}.filterbar{padding:14px 17px;background:#142029;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.filterbar label{font-size:13px;color:var(--muted)}.global-search{background:#0e151b;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 11px;min-width:230px;font-size:14px;outline:none}.global-search:focus{border-color:var(--accent)}.active-filter{font-size:12px;color:var(--accent2)}.table-wrap{overflow:auto;max-height:65vh}.empty{padding:54px 20px;text-align:center;color:var(--muted)}table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:14px}th,td{border-right:1px solid #293740;border-bottom:1px solid #293740;padding:11px 13px;text-align:left;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:#22333d;color:#dff8ef;z-index:1;font-size:13px;min-width:150px}th:first-child,td:first-child{position:sticky;left:0}th:first-child{z-index:3;background:#263b45}td:first-child{background:#19262e;font-weight:600}td{color:#d4dfe0;background:#17212a}tr:hover td{background:#203139}th:last-child,td:last-child{border-right:0}.filter-select{display:block;width:100%;margin-top:8px;background:#132028;border:1px solid #48606a;color:var(--ink);border-radius:6px;padding:6px 7px;font:inherit;font-size:12px}.filter-select:focus{outline:1px solid var(--accent)}.note{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;margin-top:17px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}.error{color:var(--danger);font-size:14px;margin:12px 0 0}.hidden{display:none!important}@media(max-width:650px){body{padding:18px 13px 30px}.topbar{margin-bottom:25px}.privacy{font-size:11px;padding:7px 9px}.brand p{display:none}.intro h2{font-size:32px}.dropzone{padding:29px 17px}.file-name{max-width:210px}.global-search{min-width:0;flex:1}.toolbar{align-items:flex-start}}
  </style>
  <style>
    th{overflow:visible}.column-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.column-menu{position:relative}.column-menu summary{list-style:none;cursor:pointer;color:var(--accent2);font-size:18px;line-height:1;padding:1px 4px;border-radius:5px}.column-menu summary::-webkit-details-marker{display:none}.column-menu summary:hover{background:#35545a}.column-menu[open] summary{background:#42666a}.menu-panel{position:absolute;top:29px;right:0;width:250px;max-height:390px;overflow:auto;padding:12px;background:#142028;border:1px solid #53717a;border-radius:10px;box-shadow:0 16px 35px rgba(0,0,0,.42);z-index:20;text-align:left}.menu-actions{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid #30434b}.menu-link{border:0;background:none;color:var(--accent2);font-size:12px;padding:2px 0;cursor:pointer;text-decoration:underline}.menu-count{color:var(--muted);font-size:12px;white-space:nowrap}.sort-actions{display:flex;gap:6px;margin-bottom:10px}.sort-btn{flex:1;border:1px solid #46616a;background:#20333b;color:var(--ink);border-radius:6px;padding:7px 5px;font-size:12px;cursor:pointer}.sort-btn:hover,.sort-btn.active{border-color:var(--accent);color:var(--accent2);background:#254b4b}.value-list{display:grid;gap:2px}.value-option{display:flex;align-items:flex-start;gap:8px;padding:7px 5px;border-radius:5px;cursor:pointer;font-size:13px;white-space:normal;line-height:1.35}.value-option:hover{background:#20343b}.value-option input{accent-color:var(--accent);margin-top:2px}.filter-state{font-size:11px;color:var(--accent2);font-weight:500;margin-left:4px}@media(max-width:650px){.menu-panel{position:fixed;left:12px;right:12px;top:100px;width:auto;max-height:60vh}}
  </style>
  <style>
    .column-menu summary{font-size:0}.column-menu summary:before{content:"";display:block;width:17px;height:17px;background:currentColor;clip-path:polygon(0 10%,100% 10%,63% 53%,63% 88%,37% 100%,37% 53%)}.filter-icon{display:none}.menu-panel{position:fixed!important;top:auto;right:auto;z-index:9999!important;background:#142028;box-shadow:0 16px 35px rgba(0,0,0,.48)}th:has(.column-menu[open]){z-index:10000!important}
    @media(max-width:650px){.menu-panel{left:12px!important;right:12px!important;width:auto!important}}
  </style>
  <style>
    .topbar .actions{display:flex;align-items:center;gap:9px}.version{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px;white-space:nowrap}.dropzone{position:relative}.dropzone:before,.dropzone:after{content:'✦';position:absolute;opacity:0;color:var(--accent2);font-size:22px;pointer-events:none}.dropzone:before{left:25%;top:24%}.dropzone:after{right:25%;bottom:22%;font-size:15px}.dropzone:hover:before,.dropzone:hover:after{animation:twinkle .9s ease-in-out infinite alternate}.dropzone:hover:after{animation-delay:.2s}.dropzone:hover .choose{animation:soft-bounce 1.1s ease-in-out infinite}@keyframes twinkle{from{opacity:0;transform:translateY(5px) rotate(-12deg) scale(.7)}to{opacity:1;transform:translateY(-6px) rotate(12deg) scale(1.1)}}@keyframes soft-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><div class="mark" aria-hidden="true">▦</div><div><h1>CSVチェッカー</h1><p>肥田木特製CSVビューア</p></div></div><div class="actions"><div class="privacy">● サーバー保存なし</div><div class="version">v1.3.0</div></div></header>
    <section class="intro"><h2>CSVを、外部ツール無しで最速確認。</h2><p>ファイルをドロップするだけで表示できます。列ごとの絞り込みにも対応。データはこのブラウザ内だけで処理され、どこにも送信されません。</p></section>
    <section id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="CSVファイルを選択またはドロップ"><strong>CSVファイルをここにドロップ</strong><span>UTF-8 / Shift-JIS に対応</span><label class="choose">ファイルを選ぶ<input id="fileInput" type="file" accept=".csv,text/csv,application/vnd.ms-excel"></label><div id="error" class="error hidden"></div></section>
    <section id="workspace" class="workspace hidden" aria-live="polite"><div class="toolbar"><div class="file-info"><span class="file-name" id="fileName"></span><span class="stats" id="stats"></span></div><div class="actions"><button class="ghost" id="clearFilters">絞り込みを解除</button><button class="ghost" id="clearData">閉じる</button></div></div><div class="filterbar"><label for="globalSearch">全体検索</label><input class="global-search" id="globalSearch" type="search" placeholder="すべての列から検索…"><span class="active-filter" id="activeFilter"></span></div><div class="table-wrap" id="tableWrap"></div></section>
    <p class="note"><span class="dot"></span>このページを閉じると、読み込んだデータも消えます。履歴・Cookie・ローカルストレージは使用しません。</p>
  </main>
  <script>
    (()=>{const wrap=document.querySelector('#tableWrap');let pendingColumn=null;
      const trimNumber=s=>{const t=String(s).trim();if(!/^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(t))return s;const n=Number(t);if(!Number.isFinite(n)||Number.isInteger(n))return s;const sign=n<0?'-':'',v=Math.trunc(Math.abs(n)*10)/10;return sign+v.toFixed(1).replace(/\.0$/,'')};
      const enhance=()=>{wrap.querySelectorAll('tbody td').forEach(td=>{if(td.dataset.trimmed)return;const next=trimNumber(td.textContent);if(next!==td.textContent){td.textContent=next;td.title=next}td.dataset.trimmed='1'});const menus=wrap.querySelectorAll('details.column-menu');menus.forEach(d=>{if(d.dataset.positioned)return;d.dataset.positioned='1';d.addEventListener('toggle',()=>{if(!d.open)return;const panel=d.querySelector('.menu-panel'),rect=d.querySelector('summary').getBoundingClientRect();requestAnimationFrame(()=>{const top=rect.top-panel.offsetHeight-8;const left=Math.max(8,Math.min(rect.left,innerWidth-panel.offsetWidth-8));panel.style.left=left+'px';panel.style.top=Math.max(8,top)+'px'})})});if(pendingColumn!==null&&menus[pendingColumn]){menus[pendingColumn].open=true;pendingColumn=null}};
      wrap.addEventListener('change',e=>{const box=e.target.closest('input[data-value-index]');if(box)pendingColumn=Number(box.dataset.col)},true);wrap.addEventListener('click',e=>{const control=e.target.closest('.select-all,.clear-column,[data-sort-col]');if(control)pendingColumn=Number(control.dataset.col??control.dataset.sortCol)},true);document.addEventListener('click',e=>{const menu=e.target.closest('details.column-menu');if(!menu)document.querySelectorAll('details.column-menu[open]').forEach(d=>d.open=false);else document.querySelectorAll('details.column-menu[open]').forEach(d=>{if(d!==menu)d.open=false})});
      new MutationObserver(enhance).observe(wrap,{childList:true,subtree:true});
    })();
  </script>
  <script>
    (()=>{const $=s=>document.querySelector(s),dz=$('#dropzone'),input=$('#fileInput'),ws=$('#workspace'),wrap=$('#tableWrap'),err=$('#error'),search=$('#globalSearch'),active=$('#activeFilter'),nameEl=$('#fileName'),stats=$('#stats');let headers=[],rows=[],selected={},sortState=null,valuesByCol=[];
      function showError(msg){err.textContent=msg;err.classList.remove('hidden')}function clearError(){err.textContent='';err.classList.add('hidden')}
      function parseCSV(text){text=text.replace(/^\uFEFF/,'');const out=[],row=[];let cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quote&&n==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v.trim()!==''))out.push(row.slice());row.length=0;cell=''}else cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(v=>v.trim()!==''))out.push(row)}if(!out.length)throw Error('データが見つかりませんでした');const width=Math.max(...out.map(r=>r.length));return{headers:out[0].map((v,i)=>v||'列 '+(i+1)),rows:out.slice(1).map(r=>Array.from({length:width},(_,i)=>r[i]??''))}}
      function render(){if(!headers.length)return;valuesByCol=headers.map((_,i)=>[...new Set(rows.map(r=>String(r[i]??'')))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true})));let filtered=rows.filter(r=>{const q=search.value.trim().toLowerCase();if(q&&!r.some(v=>String(v).toLowerCase().includes(q)))return false;return headers.every((_,i)=>!selected[i]||selected[i].has(String(r[i]??'')))});if(sortState){const i=sortState.index,dir=sortState.dir,collator=new Intl.Collator('ja',{numeric:true,sensitivity:'base'});filtered=filtered.map((r,n)=>({r,n})).sort((a,b)=>{const c=collator.compare(String(a.r[i]??''),String(b.r[i]??''));return c?c*dir:a.n-b.n}).map(x=>x.r)}let html='<table><thead><tr>'+headers.map((h,i)=>{const vals=valuesByCol[i],set=selected[i],chosen=set?set.size:vals.length,filteredOn=set?' 絞り込み中':'';return '<th title="'+esc(h)+'"><div class="column-title"><span>'+esc(h)+'<span class="filter-state">'+filteredOn+'</span></span><details class="column-menu"><summary aria-label="'+esc(h)+'の列メニュー">⋮</summary><div class="menu-panel"><div class="sort-actions"><button type="button" class="sort-btn '+(sortState&&sortState.index===i&&sortState.dir===1?'active':'')+'" data-sort-col="'+i+'" data-sort-dir="1">↑ 昇順</button><button type="button" class="sort-btn '+(sortState&&sortState.index===i&&sortState.dir===-1?'active':'')+'" data-sort-col="'+i+'" data-sort-dir="-1">↓ 降順</button></div><div class="menu-actions"><button type="button" class="menu-link select-all" data-col="'+i+'">'+vals.length+'件すべて選択</button><button type="button" class="menu-link clear-column" data-col="'+i+'">全てクリア</button><span class="menu-count">'+chosen+'件を表示</span></div><div class="value-list">'+vals.map((v,n)=>'<label class="value-option"><input type="checkbox" data-col="'+i+'" data-value-index="'+n+'" '+(!set||set.has(v)?'checked':'')+'><span>'+esc(v||'(空白)')+'</span></label>').join('')+'</div></div></details></div></th>'}).join('')+'</tr></thead><tbody>';html+=filtered.length?filtered.map(r=>'<tr>'+r.map(v=>'<td title="'+esc(v)+'">'+esc(v)+'</td>').join('')+'</tr>').join(''):'<tr><td class="empty" colspan="'+headers.length+'">条件に一致するデータがありません</td></tr>';wrap.innerHTML=html+'</tbody></table>';wrap.querySelectorAll('input[data-value-index]').forEach(box=>box.addEventListener('change',()=>{const i=Number(box.dataset.col),v=valuesByCol[i][Number(box.dataset.valueIndex)];if(!selected[i])selected[i]=new Set(valuesByCol[i]);if(box.checked)selected[i].add(v);else selected[i].delete(v);if(selected[i].size===valuesByCol[i].length)delete selected[i];render()}));wrap.querySelectorAll('.select-all').forEach(btn=>btn.addEventListener('click',()=>{delete selected[btn.dataset.col];render()}));wrap.querySelectorAll('.clear-column').forEach(btn=>btn.addEventListener('click',()=>{selected[btn.dataset.col]=new Set();render()}));wrap.querySelectorAll('[data-sort-col]').forEach(btn=>btn.addEventListener('click',()=>{sortState={index:Number(btn.dataset.sortCol),dir:Number(btn.dataset.sortDir)};render()}));stats.textContent=headers.length+'列 · '+filtered.length+' / '+rows.length+'行';const count=Object.keys(selected).length+(search.value.trim()?1:0)+(sortState?1:0);active.textContent=count?' '+count+'件の条件で表示中':''}
      function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
      async function load(file){clearError();if(!file||!file.name.toLowerCase().endsWith('.csv'))return showError('CSVファイルを選択してください。');try{const buf=await file.arrayBuffer();let text=new TextDecoder('utf-8').decode(buf);if(text.includes('�'))text=new TextDecoder('shift_jis').decode(buf);const parsed=parseCSV(text);headers=parsed.headers;rows=parsed.rows;selected={};sortState=null;nameEl.textContent=file.name;search.value='';ws.classList.remove('hidden');render()}catch(e){showError('CSVを読み込めませんでした。形式を確認してください。')}}
      input.addEventListener('change',e=>load(e.target.files[0]));dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag')});dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');load(e.dataTransfer.files[0])});dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}});search.addEventListener('input',render);$('#clearFilters').addEventListener('click',()=>{selected={};search.value='';sortState=null;render()});$('#clearData').addEventListener('click',()=>{headers=[];rows=[];selected={};sortState=null;wrap.innerHTML='';ws.classList.add('hidden');input.value='';clearError()});
    })();
  </script>
</body>
</html>
